<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('catalogo')}"></div>

        <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
            <div th:replace="~{layout/header :: header('Catálogo de Productos', 'Maestro de artículos, presentaciones y políticas de stock')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: catalogo('productos')}"></div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Listado de productos</h2>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <a th:href="@{/productos/nuevo}" class="btn btn-primary">
                                <i class="bi bi-plus-lg"></i>
                                <span>Nuevo producto</span>
                            </a>
                        </div>
                    </div>

                    <!-- Filtros Rápidos / Búsqueda -->
                    <div class="p-3 border-bottom bg-white d-flex align-items-center justify-content-between gap-3">
                        <div class="d-flex align-items-center gap-2 flex-grow-1" style="max-width: 360px;">
                            <input type="text" id="buscadorProductos" class="form-control" placeholder="Buscar por código o descripción..." onkeyup="filtrarTabla()">
                        </div>
                        <div class="text-muted" style="font-size: 13px;">
                            Mostrando <span th:text="${pagina.totalElements}">0</span> productos registrados
                        </div>
                    </div>

                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table" id="tablaProductos">
                                <thead>
                                    <tr>
                                        <th>Código</th>
                                        <th>Nombre</th>
                                        <th>Categoría</th>
                                        <th>Presentación</th>
                                        <th class="num">Stock mínimo</th>
                                        <th>Estado</th>
                                        <th class="col-actions">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="prod : ${pagina.content}">
                                        <td>
                                            <span class="cell-secondary" th:text="${prod.codigo}">PRD-001</span>
                                        </td>
                                        <td>
                                            <div class="cell-primary" th:text="${prod.nombre}">Nombre</div>
                                            <div class="cell-secondary" th:text="${prod.descripcion}">Descripción</div>
                                        </td>
                                        <td>
                                            <span class="badge badge-neutral" th:text="${prod.categoria != null ? prod.categoria.nombre : 'Sin categoría'}">Cat</span>
                                        </td>
                                        <td>
                                            <span class="cell-secondary" th:text="${prod.unidadPresentacion}">UNIDAD</span>
                                        </td>
                                        <td class="num" th:text="${prod.stockMinimo}">0</td>
                                        <td>
                                            <span th:if="${prod.estado}" class="badge badge-success">Activo</span>
                                            <span th:unless="${prod.estado}" class="badge badge-neutral">Inactivo</span>
                                        </td>
                                        <td class="col-actions">
                                            <div class="d-inline-flex align-items-center gap-1">
                                                <a th:href="@{/productos/editar/{id}(id=${prod.idProducto})}"
                                                   class="icon-btn"
                                                   title="Editar producto"
                                                   aria-label="Editar producto">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <form th:action="@{/productos/cambiar-estado/{id}(id=${prod.idProducto})}" method="post" class="d-inline">
                                                    <input type="hidden" name="estado" th:value="${!prod.estado}">
                                                    <button type="submit"
                                                            class="icon-btn is-danger"
                                                            th:title="${prod.estado ? 'Desactivar producto' : 'Activar producto'}"
                                                            th:aria-label="${prod.estado ? 'Desactivar' : 'Activar'}"
                                                            onclick="return confirm('¿Seguro de cambiar el estado de este producto?');">
                                                        <i th:class="${prod.estado ? 'bi bi-slash-circle' : 'bi bi-check-circle'}"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(pagina.content)}">
                                        <td colspan="7" class="text-center py-4 text-muted">No hay productos registrados en el sistema.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Paginación Limpia -->
                    <div class="card-header border-top" th:if="${pagina.totalPages > 1}">
                        <span class="cell-secondary">
                            Página <span th:text="${pagina.number + 1}">1</span> de <span th:text="${pagina.totalPages}">1</span>
                        </span>
                        <div class="d-flex gap-2">
                            <a class="btn btn-secondary btn-sm" th:classappend="${pagina.first ? 'disabled' : ''}"
                               th:href="@{/productos(page=${pagina.number - 1})}">Anterior</a>
                            <a class="btn btn-secondary btn-sm" th:classappend="${pagina.last ? 'disabled' : ''}"
                               th:href="@{/productos(page=${pagina.number + 1})}">Siguiente</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function filtrarTabla() {
            const input = document.getElementById('buscadorProductos');
            const filtro = input.value.toLowerCase();
            const filas = document.querySelectorAll('#tablaProductos tbody tr');
            filas.forEach(fila => {
                const texto = fila.textContent.toLowerCase();
                fila.style.display = texto.includes(filtro) ? '' : 'none';
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
