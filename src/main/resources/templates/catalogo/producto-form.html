<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${producto.idProducto == null ? 'Nuevo Producto - NEGOCIAR' : 'Editar Producto - NEGOCIAR'}">Producto - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('catalogo')}"></div>

        <div class="flex-grow-1 d-flex flex-column">
            <div th:replace="~{layout/header :: header(${producto.idProducto == null ? 'Nuevo Producto' : 'Editar Producto'}, 'Configuración del artículo y reglas de inventario')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: catalogo('productos')}"></div>

                <div class="card shadow-sm border-0 max-w-75">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h6 class="mb-0 fw-bold" th:text="${producto.idProducto == null ? 'Registrar Datos del Producto' : 'Actualizar Datos del Producto'}">Formulario</h6>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${producto.idProducto == null ? '/productos/guardar' : '/productos/actualizar/' + producto.idProducto}"
                              th:object="${producto}" method="post">

                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Código Único *</label>
                                    <input type="text" class="form-control" th:field="*{codigo}" required maxlength="50" placeholder="Ej: PRD-001" th:readonly="${producto.idProducto != null}">
                                </div>

                                <div class="col-md-8">
                                    <label class="form-label fw-semibold small">Nombre del Producto *</label>
                                    <input type="text" class="form-control" th:field="*{nombre}" required maxlength="150" placeholder="Ej: Arroz Superior 1kg">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Categoría *</label>
                                    <select class="form-select" name="idCategoria" required>
                                        <option value="">-- Seleccionar Categoría --</option>
                                        <option th:each="cat : ${categorias}"
                                                th:value="${cat.idCategoria}"
                                                th:text="${cat.nombre}"
                                                th:selected="${producto.categoria != null and producto.categoria.idCategoria == cat.idCategoria}">
                                            Categoría
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-semibold small">Unidad de Presentación *</label>
                                    <input type="text" class="form-control" th:field="*{unidadPresentacion}" required maxlength="80" placeholder="Ej: CAJA, BOTELLA">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-semibold small">Stock Mínimo *</label>
                                    <input type="number" class="form-control" th:field="*{stockMinimo}" min="0" required>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold small">Descripción</label>
                                    <textarea class="form-control" th:field="*{descripcion}" rows="3" placeholder="Información técnica o comercial..."></textarea>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i> Guardar Producto
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
