<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('catalogo')}"></div>

        <div class="flex-grow-1 d-flex flex-column">
            <div th:replace="~{layout/header :: header('Gestión de Categorías', 'Familias y clasificación del catálogo de artículos')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: catalogo('categorias')}"></div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                        <h6 class="mb-0 fw-bold"><i class="bi bi-tags me-2 text-primary"></i>Listado de Categorías</h6>
                        <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevaCategoria">
                            <i class="bi bi-plus-circle me-1"></i> Nueva Categoría
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light small text-uppercase text-secondary">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Descripción</th>
                                        <th>Estado</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categorias}">
                                        <td class="text-muted small" th:text="${cat.idCategoria}">1</td>
                                        <td class="fw-bold text-dark" th:text="${cat.nombre}">Nombre</td>
                                        <td th:text="${cat.descripcion}">Descripción</td>
                                        <td>
                                            <span th:if="${cat.estado}" class="badge bg-success-subtle text-success">Activa</span>
                                            <span th:unless="${cat.estado}" class="badge bg-secondary-subtle text-muted">Inactiva</span>
                                        </td>
                                        <td class="text-end">
                                            <div class="d-inline-flex gap-1">
                                                <!-- Botón Editar Modal -->
                                                <button type="button" class="btn btn-sm btn-outline-primary"
                                                        data-bs-toggle="modal"
                                                        th:data-bs-target="'#modalEditar-' + ${cat.idCategoria}" title="Editar">
                                                    <i class="bi bi-pencil"></i>
                                                </button>

                                                <!-- Desactivar / Activar -->
                                                <form th:if="${cat.estado}" th:action="@{/categorias/desactivar/{id}(id=${cat.idCategoria})}" method="post" class="d-inline">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Desactivar" onclick="return confirm('¿Seguro de desactivar esta categoría?');">
                                                        <i class="bi bi-slash-circle"></i>
                                                    </button>
                                                </form>
                                                <form th:unless="${cat.estado}" th:action="@{/categorias/activar/{id}(id=${cat.idCategoria})}" method="post" class="d-inline">
                                                    <button type="submit" class="btn btn-sm btn-outline-success" title="Activar">
                                                        <i class="bi bi-check-circle"></i>
                                                    </button>
                                                </form>
                                            </div>

                                            <!-- Modal Editar -->
                                            <div class="modal fade text-start" th:id="'modalEditar-' + ${cat.idCategoria}" tabindex="-1" aria-hidden="true">
                                                <div class="modal-dialog">
                                                    <div class="modal-content">
                                                        <form th:action="@{/categorias/modificar/{id}(id=${cat.idCategoria})}" method="post">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title fw-bold">Editar Categoría</h5>
                                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                            </div>
                                                            <div class="modal-body">
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-semibold small">Nombre *</label>
                                                                    <input type="text" class="form-control" name="nombre" th:value="${cat.nombre}" required maxlength="100">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-semibold small">Descripción</label>
                                                                    <textarea class="form-control" name="descripcion" rows="3" th:text="${cat.descripcion}"></textarea>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(categorias)}">
                                        <td colspan="5" class="text-center py-4 text-muted small">No hay categorías registradas.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Modal Nueva Categoria -->
                <div class="modal fade" id="modalNuevaCategoria" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
                                <div class="modal-header">
                                    <h5 class="modal-title fw-bold">Nueva Categoría</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold small">Nombre *</label>
                                        <input type="text" class="form-control" th:field="*{nombre}" required maxlength="100" placeholder="Ej: LÁCTEOS">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold small">Descripción</label>
                                        <textarea class="form-control" th:field="*{descripcion}" rows="3" placeholder="Descripción breve..."></textarea>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
