<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Solicitud de Distribución - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('distribucion')}"></div>

        <div class="flex-grow-1 d-flex flex-column">
            <div th:replace="~{layout/header :: header('Crear Solicitud de Distribución', 'Registro de requerimiento de despacho hacia sucursales')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: distribucion('solicitudes')}"></div>

                <form th:action="@{/solicitudes/guardar}" th:object="${solicitud}" method="post">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white py-3 border-bottom">
                            <h6 class="mb-0 fw-bold"><i class="bi bi-file-earmark-plus me-2 text-primary"></i>Datos Generales de la Solicitud</h6>
                        </div>
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold small">Código de Solicitud *</label>
                                    <input type="text" class="form-control" th:field="*{codigoSolicitud}" required maxlength="30" placeholder="Ej: SOL-2026-001">
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-semibold small">Destino / Sucursal *</label>
                                    <input type="text" class="form-control" th:field="*{destino}" required maxlength="200" placeholder="Ej: Sucursal Norte - Almacén Secundario">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Responsable del Destino *</label>
                                    <input type="text" class="form-control" th:field="*{responsable}" required maxlength="150" placeholder="Nombre de quien recibe">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Fecha Requerida de Entrega</label>
                                    <input type="date" class="form-control" th:field="*{fechaRequerida}">
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label fw-semibold small">Observaciones Generales</label>
                                    <input type="text" class="form-control" th:field="*{observacion}" placeholder="Instrucciones especiales de embalaje o transporte...">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla de Productos Solicitados -->
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                            <h6 class="mb-0 fw-bold"><i class="bi bi-cart me-2 text-primary"></i>Productos Solicitados (Líneas de Detalle)</h6>
                            <button type="button" class="btn btn-sm btn-outline-primary" id="btnAgregarLinea">
                                <i class="bi bi-plus-lg me-1"></i> Agregar Línea
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-bordered align-middle mb-0" id="tablaDetalles">
                                    <thead class="table-light small text-uppercase text-secondary">
                                        <tr>
                                            <th style="width: 45%;">Producto *</th>
                                            <th style="width: 20%;">Cantidad Solicitada *</th>
                                            <th style="width: 30%;">Observación / Nota</th>
                                            <th style="width: 5%;" class="text-center">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="lineasContainer">
                                        <!-- Línea inicial -->
                                        <tr>
                                            <td>
                                                <select class="form-select" name="idProducto" required>
                                                    <option value="">-- Seleccionar Producto --</option>
                                                    <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.codigo + ' - ' + p.nombre + ' (' + p.unidadPresentacion + ')'}">Prod</option>
                                                </select>
                                            </td>
                                            <td>
                                                <input type="number" class="form-control" name="cantidad" min="1" required placeholder="Cantidad">
                                            </td>
                                            <td>
                                                <input type="text" class="form-control" name="observacionLinea" placeholder="Nota opcional">
                                            </td>
                                            <td class="text-center">
                                                <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar-linea" disabled>
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/solicitudes}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Registrar Solicitud de Distribución
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <!-- Template oculto de línea para JS -->
    <template id="plantillaFila">
        <tr>
            <td>
                <select class="form-select" name="idProducto" required>
                    <option value="">-- Seleccionar Producto --</option>
                    <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.codigo + ' - ' + p.nombre + ' (' + p.unidadPresentacion + ')'}">Prod</option>
                </select>
            </td>
            <td>
                <input type="number" class="form-control" name="cantidad" min="1" required placeholder="Cantidad">
            </td>
            <td>
                <input type="text" class="form-control" name="observacionLinea" placeholder="Nota opcional">
            </td>
            <td class="text-center">
                <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar-linea">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('btnAgregarLinea').addEventListener('click', function() {
            const template = document.getElementById('plantillaFila');
            const clone = template.content.cloneNode(true);
            document.getElementById('lineasContainer').appendChild(clone);
            actualizarBotonesEliminar();
        });

        document.getElementById('lineasContainer').addEventListener('click', function(e) {
            if (e.target.closest('.btn-eliminar-linea')) {
                const filas = document.querySelectorAll('#lineasContainer tr');
                if (filas.length > 1) {
                    e.target.closest('tr').remove();
                    actualizarBotonesEliminar();
                }
            }
        });

        function actualizarBotonesEliminar() {
            const filas = document.querySelectorAll('#lineasContainer tr');
            filas.forEach((fila) => {
                const btn = fila.querySelector('.btn-eliminar-linea');
                btn.disabled = (filas.length === 1);
            });
        }
    </script>
</body>
</html>
