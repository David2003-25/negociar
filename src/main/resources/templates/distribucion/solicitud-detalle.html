<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Solicitud - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('distribucion')}"></div>

        <div class="flex-grow-1 d-flex flex-column">
            <div th:replace="~{layout/header :: header('Detalle de Solicitud', 'Estado del requerimiento y líneas solicitadas')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: distribucion('solicitudes')}"></div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-2">
                            <a th:href="@{/solicitudes}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
                            <h6 class="mb-0 fw-bold">Solicitud <span th:text="${solicitud.codigoSolicitud}">SOL-001</span></h6>
                        </div>
                        <span class="badge"
                              th:classappend="${solicitud.estado.name() == 'PENDIENTE' ? 'bg-warning text-dark' : (solicitud.estado.name() == 'EN_PROCESO' ? 'bg-info text-dark' : (solicitud.estado.name() == 'COMPLETADA' ? 'bg-success' : 'bg-danger'))}"
                              th:text="${solicitud.estado}">ESTADO</span>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="small text-muted text-uppercase fw-semibold">Destino</label>
                                <div class="fw-bold" th:text="${solicitud.destino}">Destino</div>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted text-uppercase fw-semibold">Responsable</label>
                                <div class="fw-bold" th:text="${solicitud.responsable != null ? solicitud.responsable : 'N/A'}">Responsable</div>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted text-uppercase fw-semibold">Fecha Solicitud</label>
                                <div class="fw-bold" th:text="${#temporals.format(solicitud.fechaSolicitud, 'dd/MM/yyyy HH:mm')}">01/01/2026</div>
                            </div>
                            <div class="col-md-2">
                                <label class="small text-muted text-uppercase fw-semibold">Fecha Requerida</label>
                                <div class="fw-bold" th:text="${solicitud.fechaRequerida != null ? #temporals.format(solicitud.fechaRequerida, 'dd/MM/yyyy') : '-'}">-</div>
                            </div>
                            <div class="col-12" th:if="${solicitud.observacion != null and !solicitud.observacion.isBlank()}">
                                <label class="small text-muted text-uppercase fw-semibold">Observación</label>
                                <div class="p-2 bg-light rounded text-secondary" th:text="${solicitud.observacion}">Obs</div>
                            </div>
                        </div>

                        <h6 class="fw-bold mb-3"><i class="bi bi-card-checklist me-2 text-primary"></i>Líneas Solicitadas</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle mb-0">
                                <thead class="table-light small text-uppercase text-secondary">
                                    <tr>
                                        <th>Producto</th>
                                        <th>Presentación</th>
                                        <th class="text-center">Cantidad Solicitada</th>
                                        <th>Observación</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="det : ${solicitud.detalles}">
                                        <td class="fw-bold" th:text="${det.producto.nombre}">Producto</td>
                                        <td th:text="${det.producto.unidadPresentacion}">UNIDAD</td>
                                        <td class="text-center fw-bold fs-6 text-primary" th:text="${det.cantidadSolicitada}">10</td>
                                        <td class="small text-muted" th:text="${det.observacion != null ? det.observacion : '-'}">-</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(solicitud.detalles)}">
                                        <td colspan="4" class="text-center py-3 text-muted small">No hay líneas en esta solicitud.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
