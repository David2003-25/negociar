<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría de Eventos - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('administracion')}"></div>

        <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
            <div th:replace="~{layout/header :: header('Bitácora de Auditoría', 'Registro inmutable de operaciones y trazabilidad de seguridad')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: administracion('auditoria')}"></div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Eventos y trazabilidad del sistema</h2>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Fecha / Hora</th>
                                        <th>Usuario</th>
                                        <th>Entidad</th>
                                        <th>ID Registro</th>
                                        <th>Acción</th>
                                        <th>Detalle / Motivo</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="ev : ${pagina.content}">
                                        <td class="cell-secondary" th:text="${#temporals.format(ev.fechaEvento, 'dd/MM/yyyy, HH:mm:ss')}">01/01/2026</td>
                                        <td>
                                            <span class="cell-primary" th:text="${ev.usuario != null ? ev.usuario.nombres + ' ' + ev.usuario.apellidos : 'Sistema'}">Usuario</span>
                                        </td>
                                        <td>
                                            <span class="badge badge-neutral" th:text="${ev.entidad}">Entidad</span>
                                        </td>
                                        <td class="cell-secondary" th:text="${ev.idRegistro}">1</td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="${ev.accion.contains('BLOQUEAR') ? 'badge-danger' : (ev.accion.contains('LIBERAR') ? 'badge-success' : 'badge-info')}"
                                                  th:text="${ev.accion}">ACCION</span>
                                        </td>
                                        <td class="cell-secondary" th:text="${ev.detalle != null ? ev.detalle : '-'}">-</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(pagina.content)}">
                                        <td colspan="6" class="text-center py-4 text-muted">No hay eventos de auditoría registrados en la bitácora.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Paginación -->
                    <div class="card-header border-top" th:if="${pagina.totalPages > 1}">
                        <span class="cell-secondary">
                            Página <span th:text="${pagina.number + 1}">1</span> de <span th:text="${pagina.totalPages}">1</span>
                        </span>
                        <div class="d-flex gap-2">
                            <a class="btn btn-secondary btn-sm" th:classappend="${pagina.first ? 'disabled' : ''}"
                               th:href="@{/auditoria(page=${pagina.number - 1})}">Anterior</a>
                            <a class="btn btn-secondary btn-sm" th:classappend="${pagina.last ? 'disabled' : ''}"
                               th:href="@{/auditoria(page=${pagina.number + 1})}">Siguiente</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
