<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes Técnicos - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('operaciones')}"></div>

        <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
            <div th:replace="~{layout/header :: header('Historial de Ajustes Técnicos', 'Registro de diferencias y correcciones por conteo físico')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: operaciones('ajustes')}"></div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Ajustes registrados por conteo físico</h2>
                        <a th:href="@{/ajustes/solicitar}" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i>
                            <span>Solicitar nuevo ajuste</span>
                        </a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Fecha / Hora</th>
                                        <th>Doc. referencia</th>
                                        <th class="num">Stock previo</th>
                                        <th class="num">Conteo físico</th>
                                        <th class="num">Diferencia</th>
                                        <th>Motivo</th>
                                        <th>Autorizado por</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="a : ${ajustes}">
                                        <td>
                                            <span class="cell-secondary" th:text="${a.idAjuste}">1</span>
                                        </td>
                                        <td class="cell-secondary" th:text="${#temporals.format(a.fechaAjuste, 'dd/MM/yyyy, HH:mm')}">01/01/2026</td>
                                        <td>
                                            <span class="cell-primary" th:text="${a.movimiento != null ? a.movimiento.documentoReferencia : '-'}">AJUSTE-001</span>
                                        </td>
                                        <td class="num" th:text="${a.cantidadAnterior}">0</td>
                                        <td class="num" th:text="${a.cantidadNueva}">0</td>
                                        <td class="num" th:with="dif=${a.cantidadNueva - a.cantidadAnterior}">
                                            <span class="badge"
                                                  th:classappend="${dif gt 0 ? 'badge-success' : (dif lt 0 ? 'badge-danger' : 'badge-neutral')}"
                                                  th:text="${(dif gt 0 ? '+' : '') + dif}">
                                                0
                                            </span>
                                        </td>
                                        <td>
                                            <span class="cell-primary" th:text="${a.motivo}">Diferencia de conteo</span>
                                            <div class="cell-secondary" th:if="${a.observacion != null and !a.observacion.isEmpty()}" th:text="${a.observacion}"></div>
                                        </td>
                                        <td>
                                            <span class="cell-secondary" th:text="${a.usuario != null ? a.usuario.nombres + ' ' + a.usuario.apellidos : 'Sistema'}">Autorizador</span>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(ajustes)}">
                                        <td colspan="8" class="text-center py-4 text-muted">No se han registrado ajustes técnicos en el inventario.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
