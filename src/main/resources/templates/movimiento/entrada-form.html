<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción de Entrada - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('operaciones')}"></div>

        <div class="flex-grow-1 d-flex flex-column">
            <div th:replace="~{layout/header :: header('Recepción de Entrada', 'Ingreso físico de productos con nuevo lote y asignación de ubicación')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: operaciones('movimientos')}"></div>

                <div class="card shadow-sm border-0 max-w-75">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h6 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-down me-2 text-primary"></i>Registrar Ingreso de Mercadería con Lote y Ubicación</h6>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/movimientos/entrada}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Producto *</label>
                                    <select class="form-select" name="idProducto" required>
                                        <option value="">-- Seleccionar Producto --</option>
                                        <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.codigo + ' - ' + p.nombre + ' (' + p.unidadPresentacion + ')'}">Prod</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Proveedor *</label>
                                    <select class="form-select" name="idProveedor" required>
                                        <option value="">-- Seleccionar Proveedor --</option>
                                        <option th:each="prov : ${proveedores}" th:value="${prov.idProveedor}" th:text="${prov.ruc + ' - ' + prov.razonSocial}">Prov</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Código de Lote *</label>
                                    <input type="text" class="form-control" name="codigoLote" required maxlength="50" placeholder="Ej: LOTE-2026-A1">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Fecha de Fabricación *</label>
                                    <input type="date" class="form-control" name="fechaFab" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Fecha de Vencimiento *</label>
                                    <input type="date" class="form-control" name="fechaVto" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Ubicación Destino *</label>
                                    <select class="form-select" name="idUbicacion" required>
                                        <option value="">-- Seleccionar Ubicación --</option>
                                        <option th:each="u : ${ubicaciones}" th:value="${u.idUbicacion}" th:text="${u.codigo + ' - ' + u.nombre + ' (' + u.tipo + ')'}">Ubi</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Cantidad a Ingresar *</label>
                                    <input type="number" class="form-control" name="cantidad" min="1" required placeholder="Cantidad de unidades">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Documento de Referencia (Guía / Factura)</label>
                                    <input type="text" class="form-control" name="documentoReferencia" maxlength="100" placeholder="Ej: GR-001-98765">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Observación / Nota</label>
                                    <input type="text" class="form-control" name="observacion" placeholder="Detalles de la recepción...">
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/movimientos}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-box-arrow-in-down me-1"></i> Confirmar Recepción de Entrada
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
