<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Movimiento - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('operaciones')}"></div>

        <div class="flex-grow-1 d-flex flex-column">
            <div th:replace="~{layout/header :: header('Detalle de Movimiento', 'Auditoría de líneas y trazabilidad de existencias')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: operaciones('movimientos')}"></div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-2">
                            <a th:href="@{/movimientos}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
                            <h6 class="mb-0 fw-bold">Movimiento #<span th:text="${movimiento.idMovimiento}">1</span></h6>
                        </div>
                        <span class="badge"
                              th:classappend="${movimiento.tipoMovimiento.name() == 'ENTRADA' ? 'bg-primary' : (movimiento.tipoMovimiento.name() == 'SALIDA' ? 'bg-success' : 'bg-warning text-dark')}"
                              th:text="${movimiento.tipoMovimiento}">TIPO</span>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3 mb-4">
                            <div class="col-md-3">
                                <label class="small text-muted text-uppercase fw-semibold">Fecha y Hora</label>
                                <div class="fw-bold" th:text="${#temporals.format(movimiento.fechaMovimiento, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026</div>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted text-uppercase fw-semibold">Doc. Referencia</label>
                                <div class="fw-bold" th:text="${movimiento.documentoReferencia != null ? movimiento.documentoReferencia : 'N/A'}">REF-001</div>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted text-uppercase fw-semibold">Responsable</label>
                                <div class="fw-bold" th:text="${movimiento.usuario != null ? movimiento.usuario.nombres + ' ' + movimiento.usuario.apellidos : 'Sistema'}">Usuario</div>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted text-uppercase fw-semibold">Proveedor Asociado</label>
                                <div class="fw-bold" th:text="${movimiento.proveedor != null ? movimiento.proveedor.razonSocial : 'N/A'}">-</div>
                            </div>
                            <div class="col-12" th:if="${movimiento.observacion != null and !movimiento.observacion.isBlank()}">
                                <label class="small text-muted text-uppercase fw-semibold">Observación</label>
                                <div class="p-2 bg-light rounded text-secondary" th:text="${movimiento.observacion}">Obs</div>
                            </div>
                        </div>

                        <h6 class="fw-bold mb-3"><i class="bi bi-list-check me-2 text-primary"></i>Líneas de Detalle del Movimiento</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle mb-0">
                                <thead class="table-light small text-uppercase text-secondary">
                                    <tr>
                                        <th>Operación</th>
                                        <th>Producto</th>
                                        <th>Lote</th>
                                        <th>Ubicación</th>
                                        <th class="text-center">Cantidad</th>
                                        <th class="text-center">Saldo Posterior</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="det : ${movimiento.detalles}">
                                        <td>
                                            <span class="badge" th:classappend="${det.operacion.name() == 'SUMA' ? 'bg-success' : 'bg-danger'}" th:text="${det.operacion}">SUMA</span>
                                        </td>
                                        <td class="fw-bold" th:text="${det.producto.nombre}">Producto</td>
                                        <td class="text-primary fw-semibold" th:text="${det.lote.codigoLote}">LOTE-001</td>
                                        <td><span class="badge bg-light text-dark border" th:text="${det.ubicacion.codigo}">UBI-01</span></td>
                                        <td class="text-center fw-bold fs-6" th:text="${det.cantidad}">10</td>
                                        <td class="text-center text-muted" th:text="${det.saldoPosterior != null ? det.saldoPosterior : '-'}">-</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(movimiento.detalles)}">
                                        <td colspan="6" class="text-center py-3 text-muted small">No hay líneas registradas para este movimiento.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
