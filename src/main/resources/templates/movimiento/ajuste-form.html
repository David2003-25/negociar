<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Ajuste Técnico - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }</style>
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('operaciones')}"></div>

        <div class="flex-grow-1 d-flex flex-column">
            <div th:replace="~{layout/header :: header('Solicitar Ajuste Técnico', 'Modificación de existencias por diferencia en conteo físico')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: operaciones('ajustes')}"></div>

                <div class="card shadow-sm border-0 max-w-75">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h6 class="mb-0 fw-bold"><i class="bi bi-sliders me-2 text-primary"></i>Registro de Discrepancia por Conteo Físico</h6>
                    </div>
                    <div class="card-body p-4">
                        <div class="alert alert-warning py-2 px-3 small border-0 bg-warning-subtle text-warning-emphasis mb-4">
                            <i class="bi bi-shield-lock-fill me-1"></i>
                            El ajuste técnico actualizará el saldo físico del sistema para igualarlo al conteo físico real y requiere autorización obligatoria para auditoría.
                        </div>

                        <form th:action="@{/ajustes/guardar}" method="post">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label class="form-label fw-semibold small">Existencia a Ajustar (Producto / Lote / Ubicación) *</label>
                                    <select class="form-select" name="idExistencia" required>
                                        <option value="">-- Seleccionar Existencia --</option>
                                        <option th:each="e : ${existencias}"
                                                th:value="${e.idExistencia}"
                                                th:text="${e.producto.codigo + ' - ' + e.producto.nombre + ' | Lote: ' + e.lote.codigoLote + ' | Ubicación: ' + e.ubicacion.codigo + ' (Stock Actual: ' + e.stockFisico + ')'}">
                                            Existencia
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Cantidad Conteo Físico Real *</label>
                                    <input type="number" class="form-control" name="cantidadConteo" min="0" required placeholder="Unidades contadas físicamente">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Usuario Autorizante *</label>
                                    <select class="form-select" name="idUsuarioAutorizante" required>
                                        <option value="">-- Seleccionar Supervisor / Autorizador --</option>
                                        <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombres + ' ' + u.apellidos + ' (' + u.rol.nombre + ')'}">Usuario</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Motivo del Ajuste *</label>
                                    <input type="text" class="form-control" name="motivo" required maxlength="150" placeholder="Ej: Merma por rotura, error de conteo inicial">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Observaciones Adicionales</label>
                                    <input type="text" class="form-control" name="observacion" placeholder="Detalles de la inspección física">
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/ajustes}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check-circle me-1"></i> Confirmar y Aplicar Ajuste
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
