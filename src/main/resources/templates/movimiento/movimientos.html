<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos de Inventario - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <div th:replace="~{layout/sidebar :: sidebar('operaciones')}"></div>

        <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
            <div th:replace="~{layout/header :: header('Movimientos de Inventario', 'Historial inmutable de entradas, salidas y transferencias')}"></div>

            <main class="container-fluid p-4">
                <div th:replace="~{layout/alertas :: alertas}"></div>
                <div th:replace="~{layout/subnav :: operaciones('movimientos')}"></div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h2 class="card-title">Registro inmutable de movimientos</h2>
                        <div class="d-flex gap-2">
                            <a th:href="@{/movimientos/entrada}" class="btn btn-primary">
                                <i class="bi bi-box-arrow-in-down"></i>
                                <span>Nueva entrada</span>
                            </a>
                            <a th:href="@{/movimientos/salida}" class="btn btn-secondary">
                                <i class="bi bi-box-arrow-up-right"></i>
                                <span>Salida FEFO</span>
                            </a>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tipo</th>
                                        <th>Fecha / Hora</th>
                                        <th>Doc. referencia</th>
                                        <th>Proveedor</th>
                                        <th>Responsable</th>
                                        <th>Estado</th>
                                        <th class="col-actions">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="m : ${pagina.content}">
                                        <td>
                                            <span class="cell-secondary" th:text="${m.idMovimiento}">1</span>
                                        </td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="${m.tipoMovimiento.name() == 'ENTRADA' ? 'badge-info' : (m.tipoMovimiento.name() == 'SALIDA' ? 'badge-success' : 'badge-warning')}"
                                                  th:text="${m.tipoMovimiento}">ENTRADA</span>
                                        </td>
                                        <td class="cell-secondary" th:text="${#temporals.format(m.fechaMovimiento, 'dd/MM/yyyy, HH:mm')}">01/01/2026</td>
                                        <td>
                                            <span class="cell-primary" th:text="${m.documentoReferencia != null ? m.documentoReferencia : '-'}">GUIA-001</span>
                                        </td>
                                        <td class="cell-secondary" th:text="${m.proveedor != null ? m.proveedor.razonSocial : '-'}">-</td>
                                        <td class="cell-secondary" th:text="${m.usuario != null ? m.usuario.nombres : 'Sistema'}">Usuario</td>
                                        <td>
                                            <span class="badge badge-success" th:text="${m.estado}">CONFIRMADO</span>
                                        </td>
                                        <td class="col-actions">
                                            <a th:href="@{/movimientos/{id}(id=${m.idMovimiento})}" class="icon-btn" title="Ver detalle de movimiento" aria-label="Ver detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(pagina.content)}">
                                        <td colspan="8" class="text-center py-4 text-muted">No se registran movimientos en el sistema.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Paginación -->
                    <div class="card-header border-top" th:if="${pagina.totalPages > 1}">
                        <span class="cell-secondary">
                            Página <span th:text="${pagina.number + 1}">1</span> de <span th:text="${pagina.totalPages}">1</span>
                        </span>
                        <div class="d-flex gap-2">
                            <a class="btn btn-secondary btn-sm" th:classappend="${pagina.first ? 'disabled' : ''}"
                               th:href="@{/movimientos(page=${pagina.number - 1})}">Anterior</a>
                            <a class="btn btn-secondary btn-sm" th:classappend="${pagina.last ? 'disabled' : ''}"
                               th:href="@{/movimientos(page=${pagina.number + 1})}">Siguiente</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
