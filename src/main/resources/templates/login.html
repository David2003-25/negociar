<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body {
            background-color: var(--bg-page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
            margin: 0;
            font-family: var(--font-sans);
        }

        .login-card {
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 36px 32px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
        }

        .login-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background-color: var(--primary-50);
            color: var(--primary-600);
            font-size: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--primary-100);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
        }

        .login-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        .input-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-icon-wrap .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
            z-index: 2;
        }

        .input-icon-wrap .form-control {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 42px !important;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
            background-color: #ffffff;
            color: var(--text);
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .input-icon-wrap .form-control:focus {
            border-color: var(--primary-600);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            outline: none;
        }

        .input-icon-wrap .form-control::placeholder {
            color: var(--text-disabled);
        }

        .btn-login {
            height: 44px;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--primary-600);
            border: 1px solid var(--primary-600);
            color: #ffffff;
            transition: background-color .15s ease, border-color .15s ease;
        }

        .btn-login:hover {
            background-color: var(--primary-700);
            border-color: var(--primary-700);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Ícono de usuario ("personita") y título grande -->
        <div class="text-center mb-4">
            <div class="login-avatar mb-3">
                <i class="bi bi-person-fill"></i>
            </div>
            <h1 class="login-title">NEGOCIAR</h1>
            <p class="login-subtitle">Sistema de Control de Inventario</p>
        </div>

        <!-- Mensaje de error (si las credenciales son incorrectas) -->
        <div th:if="${error}" class="alert alert-danger mb-3 py-2 px-3 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}">Error al iniciar sesión</span>
        </div>

        <!-- Formulario sin bloque de prueba y con campos integrados -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="correo" class="form-label" style="font-weight: 500; font-size: 13.5px;">Correo electrónico</label>
                <div class="input-icon-wrap">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email"
                           class="form-control"
                           id="correo"
                           name="correo"
                           required
                           autofocus
                           placeholder="ejemplo@negociar.com"
                           autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label" style="font-weight: 500; font-size: 13.5px;">Contraseña</label>
                <div class="input-icon-wrap">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           required
                           placeholder="••••••••"
                           autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Iniciar sesión</span>
            </button>
        </form>

        <div class="mt-4 text-center text-muted" style="font-size: 12px;">
            &copy; 2026 NEGOCIAR WMS
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
