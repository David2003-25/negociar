<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NEGOCIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body {
            background-color: var(--sidebar-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
        }
        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-card);
            background-color: var(--bg-surface);
            width: 100%;
            max-width: 400px;
            padding: var(--space-8) var(--space-6);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center brand-icon mb-3" style="width: 44px; height: 44px; font-size: 24px;">
                <i class="bi bi-box-seam"></i>
            </div>
            <h1 class="page-title mb-1" style="font-size: 20px;">NEGOCIAR</h1>
            <p class="page-subtitle">Sistema de Control de Inventario</p>
        </div>

        <div th:if="${error}" class="alert alert-danger mb-3" role="alert">
            <i class="bi bi-exclamation-triangle"></i>
            <span th:text="${error}">Error al iniciar sesión</span>
        </div>

        <div class="alert alert-info py-2 px-3 mb-3">
            <i class="bi bi-info-circle"></i>
            <span><strong>Prueba:</strong> admin@negociar.com / admin123</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted" style="border-color: var(--border-strong);"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" id="correo" name="correo" value="admin@negociar.com" required autofocus placeholder="ejemplo@negociar.com">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted" style="border-color: var(--border-strong);"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" value="admin123" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Iniciar sesión</span>
            </button>
        </form>

        <div class="mt-4 text-center cell-secondary">
            &copy; 2026 NEGOCIAR WMS
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
